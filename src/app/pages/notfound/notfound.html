<div class="min-h-screen flex items-center justify-center px-6">
  <div class="text-center max-w-lg">
    
    <!-- 404 Number -->
    <h1 class="text-7xl md:text-8xl font-display font-bold text-primary mb-4">
      404
    </h1>

    <!-- Message -->
    <h2 class="text-2xl md:text-3xl font-semibold text-dark mb-3">
      Page not found
    </h2>

    <p class="text-neutral mb-6">
      The page you’re looking for doesn’t exist or has been moved.
    </p>

    <!-- Button -->
    <button
      (click)="goHome()"
      class="px-6 py-3 rounded-xl bg-primary text-white font-medium hover:opacity-90 transition"
    >
      Go back home
    </button>

  </div>
</div>
