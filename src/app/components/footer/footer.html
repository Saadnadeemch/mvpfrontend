<footer class="py-6 select-none">
  <div class="w-full px-4 sm:px-6 md:px-10 lg:px-12">
    <!-- Mobile Layout: Stacked vertically -->
    <div class="flex flex-col gap-2 sm:hidden">
      <!-- Top on mobile: Social icons (LEFT side content) -->
      <div class="social-container flex items-center gap-3 justify-center cursor-default">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" class="social-icon h-4 w-4" />
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"
          class="social-icon h-4 w-4" />
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" class="social-icon h-4 w-4" />
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok" class="social-icon h-4 w-4" />
        <span class="social-text text-[9px] font-bold" style="color: var(--color-neutral)">+ 1800 more</span>
      </div>

      <!-- Bottom on mobile: Legal links (RIGHT side content) -->
      <div class="flex flex-col items-center gap-3">
        <div class="flex items-center gap-2 flex-wrap justify-center">
          <span [routerLink]="['/privacy-and-policy']"
            class="text-[10px] font-medium transition-opacity hover:opacity-70 cursor-pointer"
            style="color: var(--color-neutral)">Privacy Policy</span>
          <span class="text-[10px]" style="color: var(--color-neutral); opacity: 0.35">·</span>
          <span [routerLink]="['/terms-of-service']"
            class="text-[10px] font-medium transition-opacity hover:opacity-70 cursor-pointer"
            style="color: var(--color-neutral)">Terms of Service</span>
        </div>
      </div>
    </div>

    <!-- Tablet and Desktop Layout: Side by side -->
    <div class="hidden sm:flex items-center justify-between gap-6">
      <!-- Left side: Social icons -->
      <div class="social-container flex items-center gap-4 cursor-default">
        <img src="https://cdn-icons-png.flaticon.com/128/1384/1384060.png" alt="YouTube"
          class="h-5 w-5 transition-transform hover:scale-110" />
        <img src="https://cdn-icons-png.flaticon.com/128/2111/2111463.png" alt="Instagram"
          class="h-5 w-5 transition-transform hover:scale-110" />
        <img src="https://cdn-icons-png.flaticon.com/128/733/733579.png" alt="Twitter"
          class="h-5 w-5 transition-transform hover:scale-110" />
        <img src="https://cdn-icons-png.flaticon.com/128/3046/3046121.png" alt="TikTok"
          class="h-5 w-5 transition-transform hover:scale-110" />
        <span class="text-xs font-bold ml-2" style="color: var(--color-neutral)">+ 1800 more</span>
      </div>
      <!-- Right side: Legal links -->
      <div class="flex items-center gap-2 shrink-0">
        <span [routerLink]="['/privacy-and-policy']"
          class="text-xs font-medium transition-opacity hover:opacity-70 cursor-pointer"
          style="color: var(--color-neutral)">Privacy Policy</span>
        <span class="text-xs" style="color: var(--color-neutral); opacity: 0.35">·</span>
        <span [routerLink]="['/terms-of-service']"
          class="text-xs font-medium transition-opacity hover:opacity-70 cursor-pointer"
          style="color: var(--color-neutral)">Terms of Service</span>
      </div>
    </div>
  </div>
</footer>
