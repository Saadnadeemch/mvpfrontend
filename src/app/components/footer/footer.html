<footer class="py-6 select-none">
  <div class="w-full px-4 sm:px-6 md:px-10 lg:px-12 flex flex-col items-center gap-3 sm:flex-row sm:gap-0">
    
    <!-- Social icons -->
    <div class="social-container flex items-center gap-4 cursor-default sm:flex-1 sm:justify-center">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" class="social-icon h-5 w-5" />
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" class="social-icon h-5 w-5" />
      <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" class="social-icon h-5 w-5" />
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok" class="social-icon h-5 w-5" />
      <span class="social-text text-xs font-bold" style="color: var(--color-neutral)">+ 1800 more</span>
    </div>

    <!-- Legal links -->
    <div class="flex items-center gap-2 sm:flex-none">
      <span
        [routerLink]="['/privacy-and-policy']"
        class="text-[10px] sm:text-xs font-medium transition-opacity hover:opacity-70 cursor-pointer"
        style="color: var(--color-neutral)"
      >Privacy Policy</span>
      <span class="text-[10px] sm:text-xs" style="color: var(--color-neutral); opacity: 0.35">·</span>
      <span
        [routerLink]="['/terms-of-service']"
        class="text-[10px] sm:text-xs font-medium transition-opacity hover:opacity-70 cursor-pointer"
        style="color: var(--color-neutral)"
      >Terms of Service</span>
    </div>

  </div>
</footer>
