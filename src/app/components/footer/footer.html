<footer class="py-6 select-none">
  <div class="w-full px-4 sm:px-6 md:px-10 lg:px-12">

    <!-- Mobile Layout -->
    <div class="flex flex-col gap-2 sm:hidden">

      <!-- Top on mobile: Branding -->
      <div class="flex justify-center">
        <span class="text-[10px] font-medium" style="color: var(--color-neutral)">
          © 2026 Buckty
        </span>
      </div>

      <!-- Bottom on mobile: Legal links -->
      <div class="flex flex-col items-center gap-3">
        <div class="flex items-center gap-2 flex-wrap justify-center">
          <span [routerLink]="['/privacy-and-policy']"
            class="text-[10px] font-medium transition-opacity hover:opacity-70 cursor-pointer"
            style="color: var(--color-neutral)">
            Privacy Policy
          </span>

          <span class="text-[10px]" style="color: var(--color-neutral); opacity: 0.35">
            ·
          </span>

          <span [routerLink]="['/terms-of-service']"
            class="text-[10px] font-medium transition-opacity hover:opacity-70 cursor-pointer"
            style="color: var(--color-neutral)">
            Terms of Service
          </span>
        </div>
      </div>
    </div>

    <!-- Tablet & Desktop Layout -->
    <div class="hidden sm:flex items-center justify-between gap-6">

      <!-- Left side: Branding -->
      <div class="flex items-center">
        <span class="text-xs font-medium" style="color: var(--color-neutral)">
          © 2026 Buckty
        </span>
      </div>

      <!-- Right side: Legal links -->
      <div class="flex items-center gap-2 shrink-0">

        <a href="/privacy-and-policy" class="text-xs font-medium transition-opacity hover:opacity-70 cursor-pointer"
          style="color: var(--color-neutral)">
          Privacy Policy
        </a>

        <span class="text-xs" style="color: var(--color-neutral); opacity: 0.35">
          ·
        </span>

        <a href="/terms-of-service" class="text-xs font-medium transition-opacity hover:opacity-70 cursor-pointer"
          style="color: var(--color-neutral)">
          Terms of Service
        </a>
      </div>
    </div>

  </div>
</footer>
